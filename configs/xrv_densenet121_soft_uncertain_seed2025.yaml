seed: 2025
output_dir: outputs/xrv_densenet121_soft_uncertain_seed2025
model:
  name: xrv_densenet121_all
  pretrained: true
  preprocessing: torchxrayvision
label_strategy:
  name: soft_uncertain
  uncertain_soft_target: 0.5
  uncertain_sample_weight: 0.5
training:
  epochs: 20
  batch_size: 16
  learning_rate: 0.0001
  num_workers: 0
  weight_decay: 0.00001
  image_size: 224
  early_stopping_patience: 4
  early_stopping_min_delta: 0.001
  scheduler_factor: 0.5
  scheduler_patience: 2
  scheduler_min_lr: 0.000001
  amp_enabled: true
  class_weighting: true
