experiment: P7_resnet50_context_preserving
input_mode: context_preserving
seed: 42
backbone: resnet50
pretrained: true
input_size: 224
preprocessing: imagenet
augmentation: historical
horizontal_flip: false
rotation_degrees: 7
loss: weighted_bce
optimizer: adamw
